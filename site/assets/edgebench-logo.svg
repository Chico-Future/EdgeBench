<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1252 1325" role="img" aria-labelledby="title description">
  <title id="title">EdgeBench</title>
  <desc id="description">A silver folded page mark with rounded corners and the EdgeBench wordmark.</desc>

  <defs>
    <linearGradient id="silver-top" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#aeb6c5"/>
      <stop offset=".32" stop-color="#c9cfdb"/>
      <stop offset=".66" stop-color="#e9edf4"/>
      <stop offset=".88" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#d9dfe8"/>
    </linearGradient>
    <radialGradient id="top-sheen" cx="78%" cy="16%" r="90%">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver-fold" x1="0" y1="0" x2=".78" y2="1">
      <stop offset="0" stop-color="#aeb7c7"/>
      <stop offset=".42" stop-color="#8993a4"/>
      <stop offset=".76" stop-color="#697383"/>
      <stop offset="1" stop-color="#a7afbe"/>
    </linearGradient>
    <linearGradient id="dark-fold" gradientUnits="userSpaceOnUse" x1="190" y1="578.5" x2="1060" y2="484.5">
      <stop offset="0" stop-color="#252d39"/>
      <stop offset=".38" stop-color="#1e2631"/>
      <stop offset=".72" stop-color="#333d4c"/>
      <stop offset="1" stop-color="#596273"/>
    </linearGradient>
    <linearGradient id="silver-bottom" x1="0" y1=".35" x2="1" y2=".8">
      <stop offset="0" stop-color="#697383"/>
      <stop offset=".36" stop-color="#8b95a5"/>
      <stop offset=".72" stop-color="#b8c0cd"/>
      <stop offset="1" stop-color="#788292"/>
    </linearGradient>
    <radialGradient id="bottom-sheen" cx="68%" cy="56%" r="76%">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".045"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff" stop-opacity=".76"/>
      <stop offset=".52" stop-color="#667184" stop-opacity=".48"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".72"/>
    </linearGradient>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111a27" flood-opacity=".12"/>
    </filter>
    <filter id="crease-blur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <g id="folded-mark" filter="url(#soft-shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Paint order defines the fold stack: lower trapezoid, middle triangle, left hinge face, upper trapezoid. -->
    <!-- Lower page: broad, smooth outer corners around the unchanged diamond anchors. -->
    <g id="lower-trapezoid">
    <path id="lower-page" d="M 649.4 558.7
      L 1025.2 770.4 Q 1060 790 1023.4 806
      L 669 960.8 Q 625 980 581 960.8
      L 190 790 L 614.5 550.9 L 625 545 Z" fill="url(#silver-bottom)"/>
    <path d="M 649.4 558.7
      L 1025.2 770.4 Q 1060 790 1023.4 806
      L 669 960.8 Q 625 980 581 960.8
      L 190 790 L 614.5 550.9 L 625 545 Z" fill="url(#bottom-sheen)"/>
    <path d="M 649.4 558.7 L 1025.2 770.4 Q 1060 790 1023.4 806
      L 669 960.8 Q 625 980 581 960.8 L 190 790
      L 614.5 550.9 L 625 545 Z" fill="none" stroke="url(#edge-metal)" stroke-opacity=".66" stroke-width="2.2"/>
    </g>

    <!-- The rounded isosceles fold returns to its original tip at (1060, 555), centered on the base. -->
    <g id="middle-triangle">
    <path id="center-fold" d="M 190 320
      L 1031.1 547 Q 1060 555 1031.1 563
      L 190 790 Z"
      fill="url(#dark-fold)"/>
    <!-- Keep the triangle's rim in the same middle layer so the upper page can cover it. -->
    <path d="M 190 320
      L 1031.1 547 Q 1060 555 1031.1 563
      L 190 790 Z"
      fill="none" stroke="#b6bfce" stroke-opacity=".2" stroke-width="1.5"/>
    </g>

    <!-- The left hinge face is the same dark middle sheet indicated in the reference. -->
    <path id="left-fold" d="M 190 320 L 625 545 L 190 790 Z" fill="url(#dark-fold)"/>

    <!-- Upper trapezoid: a broad rounded crown and outer tip. -->
    <g id="upper-trapezoid">
    <path id="upper-page" d="M 190 320 L 590 113
      Q 625 95 660 113 L 1026.3 302.6
      Q 1060 320 1026.3 337.4 L 625 545 Z" fill="url(#silver-top)"/>
    <path d="M 190 320 L 590 113
      Q 625 95 660 113 L 1026.3 302.6
      Q 1060 320 1026.3 337.4 L 625 545 Z" fill="url(#top-sheen)"/>

    <!-- Subtle cold-metal rims replace the heavy black outline. -->
    <path d="M 190 320 L 590 113 Q 625 95 660 113
      L 1026.3 302.6 Q 1060 320 1026.3 337.4 L 625 545 Z"
      fill="none" stroke="url(#edge-metal)" stroke-width="2.4"/>
    </g>

    <!-- Soft fold shadows stay confined to the existing seams. -->
    <path d="M 190 320 L 625 545" fill="none" stroke="#17202c" stroke-opacity=".24" stroke-width="4" filter="url(#crease-blur)"/>
    <path d="M 190 320 L 625 545" fill="none" stroke="#273241" stroke-opacity=".26" stroke-width="2.2"/>
    <path d="M 625 545 L 190 790" fill="none" stroke="#17202c" stroke-opacity=".28" stroke-width="3"/>
    <path d="M 622 542 L 194 786" fill="none" stroke="#edf1f7" stroke-opacity=".28" stroke-width="1.2"/>
    <path d="M 190 320 L 190 790" fill="none" stroke="#e9edf4" stroke-opacity=".55" stroke-width="2"/>
  </g>

  <text
    x="625"
    y="1228"
    fill="#191d22"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="142"
    font-weight="650"
    letter-spacing="-1"
    text-anchor="middle">EdgeBench</text>
</svg>
